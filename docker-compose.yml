services:
  postgres:
    image: postgres:16-alpine
    container_name: games-nanno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: games_nanno_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - games-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: games-nanno-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database connection for internal Docker network
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/games_nanno_db
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-secret-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - games-network

networks:
  games-network:
    driver: bridge

volumes:
  postgres_data:
