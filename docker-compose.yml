x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  container_name: games-nanno-app
  restart: unless-stopped
  networks:
    - games-network

x-postgres-base: &postgres-base
  image: postgres:16-alpine
  container_name: games-nanno-postgres
  restart: unless-stopped
  volumes:
    - postgres_data:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - games-network

services:
  postgres:
    <<: *postgres-base
    profiles: ["production"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-games_nanno_db}
    expose:
      - "5432"

  postgres-debug:
    <<: *postgres-base
    profiles: ["debug"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: games_nanno_db
    ports:
      - "5432:5432"

  app:
    <<: *app-base
    profiles: ["production"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-games_nanno_db}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  app-debug:
    <<: *app-base
    profiles: ["debug"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres-debug:5432/games_nanno_db
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-please-change}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:3000}
      # Debug-specific settings
      NEXT_TELEMETRY_DISABLED: "1"
      DEBUG: "*"
    depends_on:
      postgres-debug:
        condition: service_healthy
    ports:
      - "3000:3000"

networks:
  games-network:
    driver: bridge

volumes:
  postgres_data: