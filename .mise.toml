[tools]
node = "20"
pnpm = "latest"

[tasks.up]
description = "Start all Docker services"
run = "docker-compose up -d"

[tasks.down]
description = "Stop all Docker services"
run = "docker-compose down"

[tasks.update]
description = "Rebuild and restart Next.js container"
run = """
docker-compose stop app
DOCKER_BUILDKIT=0 docker-compose build app
docker-compose up -d app
"""

[tasks.logs]
description = "Show logs from all services"
run = "docker-compose logs -f"

[tasks."logs:app"]
description = "Show logs from Next.js app"
run = "docker-compose logs -f app"

[tasks.build]
description = "Build all Docker images"
run = "DOCKER_BUILDKIT=0 docker-compose build"

[tasks.restart]
description = "Restart all services"
run = "docker-compose restart"

[tasks."db:shell"]
description = "Open PostgreSQL shell"
run = "docker-compose exec postgres psql -U postgres -d games_nanno_db"

[tasks.dev]
description = "Start PostgreSQL in Docker and Next.js dev server locally"
run = """
echo "Starting PostgreSQL database..."
docker-compose up -d postgres
echo "Waiting for database to be ready..."
sleep 3
echo "Starting Next.js development server..."
pnpm dev
"""

[tasks."dev:db"]
description = "Start only PostgreSQL in Docker for local development"
run = "docker-compose up -d postgres"

[tasks."dev:stop"]
description = "Stop PostgreSQL container"
run = "docker-compose stop postgres"

[tasks."dev:logs"]
description = "Show PostgreSQL logs for development"
run = "docker-compose logs -f postgres"

[tasks.clean]
description = "Stop services and remove volumes (WARNING: destroys data)"
run = "docker-compose down -v"
